[project]
name = "taskvault"
version = "0.1.0"
description = "A tiny, dependency-free task tracker used for the Omnigent Polly demo."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
taskvault = "taskvault.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
